[build]
  command   = "npm run build"
  publish   = "dist/snapfolio/browser"

[images]
  # Allow Netlify Image CDN to resize private S3 objects via their presigned URLs.
  remote_images = ['https://520371284888-assets\.s3\.amazonaws\.com/.*']

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-lived cache for AVIF images (immutable content)
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-lived cache for hashed JS/CSS bundles
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for manifest (changes when images are added)
[[headers]]
  for = "/image/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

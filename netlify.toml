[build]
  command   = "npm run build"
  publish   = "dist/snapfolio/browser"

[images]
  # Allow Netlify Image CDN to resize private S3 objects via their presigned URLs.
  remote_images = ['https://520371284888-assets\.s3\.amazonaws\.com/.*']

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache local assets while still allowing updated files to revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Long-lived cache for hashed JS/CSS bundles
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

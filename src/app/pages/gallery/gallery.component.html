<main class="gallery-page">

    <!-- Category filters — no "All" -->
    <div class="filter-area">
        <div class="filter-bar">
            @for (cat of categories; track cat) {
            <button class="filter-btn" [class.active]="activeCategory() === cat"
                [attr.aria-pressed]="activeCategory() === cat" (click)="setCategory(cat)">
                {{ cat }}
            </button>
            }
        </div>
    </div>

    <!-- Initial skeleton — 4 visible placeholders -->
    @if (isInitialLoad()) {
    <div class="photo-grid">
        @for (n of skeletonItems; track n) {
        <div class="photo-item skeleton-only">
            <div class="photo-skeleton"></div>
        </div>
        }
    </div>
    } @else {

    <!-- Photo grid — all URLs rendered immediately, images reveal as they load -->
    <div class="photo-grid">
        @for (img of images(); track img.key; let i = $index) {
        <button class="photo-item" [class.loaded]="isLoaded(img.url)" [style.--stagger]="staggerDelay(i)"
            (click)="openLightbox(i, $event)" [attr.aria-label]="'View photo'">
            <div class="photo-skeleton"></div>
            <img [src]="img.url" alt="" loading="lazy" (load)="onImageLoad(img.url)" />
        </button>
        }

        <!-- Inline skeletons for in-progress next page -->
        @if (isLoading()) {
        @for (n of skeletonItems; track n) {
        <div class="photo-item skeleton-only">
            <div class="photo-skeleton"></div>
        </div>
        }
        }
    </div>

    <!-- Sentinel for infinite scroll -->
    <div #sentinel class="sentinel"></div>

    }

    <!-- Lightbox -->
    @if (lightboxIndex() !== null) {
    <app-lightbox [photos]="lightboxPhotos()" [activeIndex]="lightboxIndex()!" (close)="closeLightbox()" />
    }

</main>
